  /api/v1/search/parts:
    get:
      operationId: searchParts
      summary: البحث عن عناصر مخزون متوافقة مع معايير محددة
      description: 'نقطة الوصول الوحيدة لخدمة البحث في كامل النظام؛ يُعاد استخدام العملية نفسها بلا أي
        تفريع عبر أربعة سياقات واجهة مستخدم مختلفة (تصميم إعادة استخدام، لا تغيير في المتطلبات أو منطق
        البحث): الصفحة الرئيسية (نموذج بحث كامل)، صفحة نتائج البحث (نفس النموذج مع الاحتفاظ بالفلاتر المختارة)،
        صفحة تفاصيل المنتج (نموذج مبسَّط أو "بحث مشابه" بتعبئة مسبقة من جهة العميل لمعاملات كـtrim_ref_id
        وcondition_ref_id)، وصفحة المتجر (نفس النموذج مع تمرير store_ref_id تلقائيًا). أي حقل مرجعي لم
        يحدِّده المستهلك يعني عدم تطبيق ذلك الفلتر (REQ-SRC-010) — لا تُرسَل قيمة "all" حرفية أبدًا.

        '
      x-traceability:
        requirements:
        - REQ-SRC-001
        - REQ-SRC-003
        - REQ-SRC-004
        - REQ-SRC-006
        - REQ-SRC-006-C
        - REQ-SRC-006-D
        - REQ-SRC-006-E
        - REQ-SRC-007
        - REQ-SRC-007-A
        - REQ-SRC-010
        - REQ-SRC-011
        - REQ-SRC-013
        decisions:
        - CR-004
        - CR-006
      security: []
      parameters:
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - name: q
        in: query
        schema:
          type: string
        description: نص البحث الحر
      - name: trim_ref_id
        in: query
        schema:
          type: string
          format: uuid
        description: غيابه يعني عدم التصفية بفئة سيارة محددة (REQ-SRC-010)، لا قيمة "الكل" مرسَلة
      - name: price_filter
        in: query
        schema:
          type: string
          enum:
          - all
          - priced_only
          - unpriced_only
        description: يبقى تصنيفًا ثلاثيًا كما هو (REQ-SRC-004)؛ لم يتأثر بـCR-006
      - name: condition_ref_id
        in: query
        schema:
          type: string
          format: uuid
        description: غيابه يعني عدم التصفية بحالة قطعة محددة (REQ-SRC-010)
      - name: verified_sellers_only
        in: query
        schema:
          type: boolean
      - name: country_ref_id
        in: query
        required: false
        description: 'اختياري؛ عند غيابه يُحدَّد تلقائيًا من جهة الخادم وفق ترتيب الحساب ثم الموقع الجغرافي
          ثم IP (REQ-SRC-006-C)، أو دون تصفية جغرافية إن تعذَّر الاكتشاف (REQ-SRC-006-E).

          '
        schema:
          type: string
          format: uuid
      - name: city_ref_id
        in: query
        schema:
          type: string
          format: uuid
      - name: store_ref_id
        in: query
        required: false
        description: 'اختياري؛ يُستخدَم عند إعادة استخدام مكوّن البحث ضمن سياق صفحة متجر محدد، لتقييد
          النتائج على عناصر ذلك المتجر فقط.

          '
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        in: query
        schema:
          type: integer
          minimum: 1
          default: 20
      - name: sort
        in: query
        schema:
          type: string
        description: بصيغة <حقل>:<asc|desc>؛ افتراضيًا وفق سياسة الترتيب المعتمدة؛ آخر قيمة يستخدمها العضو
          المسجَّل تُحفَظ وتُقتَرح تلقائيًا لاحقًا (REQ-SRC-013)
      responses:
        '200':
          description: نتائج البحث
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: معيار تصفية غير صالح (قيمة مرجعية غير موجودة)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
