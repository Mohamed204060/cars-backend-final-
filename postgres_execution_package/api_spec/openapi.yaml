openapi: 3.0.3
info:
  title: منصة قطع غيار السيارات - Auto Parts Marketplace API
  version: 1.16.0
  description: 'مواصفة API تنفيذية، تغطي 15 عملية (Operations) عبر 14 مسارًا (Paths): الواجهات التمثيلية
    الخمس الأصلية الموثّقة بالتفصيل في التصميم التفصيلي (الحزمة 2)، بالإضافة إلى 5 عمليات خدمة Auth (اعتماد
    Contract Extension & Implementation Plan): تسجيل خروج، عرض/إضافة/إزالة وسائل الهوية، وعرض مزوّدي الهوية
    المفعَّلين — فتصبح عمليات Auth تحديدًا 6 عمليات شاملة /auth/login الأصلية. وبالإضافة أيضًا إلى 5 عمليات
    خدمة PCT (الكتالوج): اقتراح قطعة، عرضها، اعتمادها (مدير النظام فقط، REQ-PCT-002)، إضافة اسم مترجَم،
    وتسجيل رقم OEM. وبالإضافة إلى 7 عمليات خدمة VCT (كتالوج السيارات): اقتراح واعتماد شركة مصنّعة (مدير
    النظام فقط، REQ-VCT-002)، عرضها، اقتراح موديل تحت شركة معتمَدة (REQ-VCT-003)، إضافة جيل، إضافة فئة
    سيارة، وعرض فئة سيارة. وبالإضافة إلى 4 عمليات خدمة CMP (التوافق): إنشاء سجل توافق بين قطعة معتمَدة
    وفئة صالحة (مدير النظام فقط، REQ-CMP-001/002)، عرض سجل، عرض كل سجلات قطعة، وأرشفته (مدير النظام فقط،
    REQ-CMP-003). وبالإضافة أيضًا إلى خدمتَي Store وInventory: إنشاء/ عرض متجر، تغيير حالته (مدير نظام
    أو مشرف، REQ-STR-004)، نقل ملكيته (مدير نظام حصريًا، REQ-STR-006)؛ وعرض/تحديث كمية/تسعير/إخفاء/إظهار/
    أرشفة عنصر مخزون (البائع المالك فقط، REQ-STR-019) إلى جانب /inventory-items الأصلية (إنشاء العنصر،
    مع Idempotency-Key مطلوب). جميع مسارات هذا الإصدار موحَّدة تحت البادئة /api/v1 اتساقًا مع DD الحزمة
    2، القسم 2.1. كل عملية موسومة بامتداد x-traceability يربطها بمعرّفات المتطلبات (REQ) وقرارات ADR/Change
    Request ذات الصلة.

    '
  x-governance: 'أي تغيير غير متوافق على أي عملية يستوجب إصدار نسخة عقد جديدة (/api/v{n}) بدلاً من تعديل
    هذه النسخة مباشرة (DD الحزمة 2، القسم 2.1). هذا الملف يُوسَّع تدريجيًا؛ لا يُحذَف أو يُعدَّل أي عملية
    قائمة دون Change Request رسمي وفق دليل حوكمة التنفيذ. عمليات التسجيل/الدخول عبر Google/Facebook/X
    (REQ-IAM-011) مؤجَّلة عمدًا إلى Increment لاحق ضمن مرحلة Auth، بانتظار ADR يحسم تدفق التحقق الآمن؛
    لا عملية OAuth موثَّقة هنا حتى صدوره.

    '
servers:
- url: /api/v1
  description: الإصدار الأول من عقود API (URI Versioning، DD الحزمة 2)
security:
- sessionAuth: []
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: session_id
      description: 'جلسة مستخدم صادرة عن وحدة IAM بعد تسجيل دخول ناجح (REQ-IAM-003)، مدعومة بجدول iam.sessions
        (CR-013). تُسلَّم عبر Set-Cookie بخصائص HttpOnly (لا يقرأها JavaScript) وSecure (HTTPS فقط) وSameSite=Lax
        كحد أدنى. يُخزَّن على الخادم بصمة SHA-256 للتوكن فقط، لا التوكن الخام (اتساقًا مع REQ-SEC-002).
        غير مطلوبة لعمليات الوصول العام مثل تسجيل الدخول نفسه أو البحث أو عرض مزوّدي الهوية المفعَّلين.

        '
  parameters:
    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      description: 'معرّف تتبع اختياري يرفقه المستهلك؛ إن غاب يُنشئ النظام معرّفًا جديدًا عند نقطة الدخول
        (SAD الحزمة 4، DD الحزمة 2 القسم 2.4).

        '
      schema:
        type: string
        format: uuid
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: 'مفتاح عدم تكرار للعمليات الحساسة المعرَّضة لإعادة الإرسال (DD الحزمة 2، القسم 2.2).
        مطلوب فعليًا (required) على مستوى العملية عند الإنشاء، لا على مستوى الوثيقة العام.

        '
      schema:
        type: string
  schemas:
    ErrorResponse:
      type: object
      description: نموذج الخطأ الموحّد المعتمد لجميع واجهات API (DD الحزمة 2، القسم 2.1/2.2)
      required:
      - correlation_id
      - error_code
      - message
      properties:
        correlation_id:
          type: string
          format: uuid
        error_code:
          type: string
          example: PART_NOT_APPROVED
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              reason:
                type: string
    PaginationMeta:
      type: object
      description: بيانات التقسيم الموحّدة (DD الحزمة 2، القسم 2.3)
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total_items:
          type: integer
    LoginRequest:
      type: object
      required:
      - login_identifier
      - password
      properties:
        login_identifier:
          type: string
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      description: 'لا يتضمَّن التوكن الخام (session_id) في جسم الاستجابة عمدًا (تصحيح CR-013)؛ يُسلَّم
        حصرًا عبر Set-Cookie بخصائص HttpOnly وSecure وSameSite، لمنع وصول أي كود JavaScript إليه ولو عبر
        قراءة جسم استجابة تسجيل الدخول نفسها.

        '
      properties:
        primary_role:
          type: string
        account_status:
          type: string
    InventoryItemCreateRequest:
      type: object
      required:
      - catalog_part_ref_id
      - condition_ref_id
      - pricing_mode
      - quantity
      properties:
        catalog_part_ref_id:
          type: string
          format: uuid
        condition_ref_id:
          type: string
          format: uuid
        pricing_mode:
          type: string
          enum:
          - fixed_price
          - contact_for_price
        price_amount:
          type: number
          format: double
        price_currency:
          type: string
          minLength: 3
          maxLength: 3
        quantity:
          type: integer
          minimum: 0
        photo_asset_refs:
          type: array
          items:
            type: string
    InventoryItemCreateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        business_code:
          type: string
        status:
          type: string
    OfferSubmitRequest:
      type: object
      required:
      - amount
      - currency
      - provides_shipping
      properties:
        amount:
          type: number
          format: double
        currency:
          type: string
          minLength: 3
          maxLength: 3
        provides_shipping:
          type: boolean
        notes:
          type: string
    OfferSubmitResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        business_code:
          type: string
        status:
          type: string
          enum:
          - submitted
    SearchResultItem:
      type: object
      properties:
        inventory_item_id:
          type: string
          format: uuid
        business_code:
          type: string
        part_name:
          type: string
        store_id:
          type: string
          format: uuid
        store_name:
          type: string
        image_url:
          type: string
        price_amount:
          type: number
          nullable: true
        price_display_text:
          type: string
          description: نص بديل عند غياب السعر (REQ-STR-014)
    SearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResultItem'
        effective_country_code:
          type: string
          description: الدولة الفعّالة المستخدَمة في التصفية (REQ-SRC-006-C)
        effective_country_source:
          type: string
          enum:
          - account
          - geolocation
          - ip
          - manual
          description: مصدر الدولة الفعّالة (مقترح توضيحي معتمَد، DD الحزمة 2 v1.4)
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    BulkImportPreviewResponse:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
        new_count:
          type: integer
        updated_count:
          type: integer
        rejected_count:
          type: integer
        rejected_rows:
          type: array
          items:
            type: object
            properties:
              row_number:
                type: integer
              reason:
                type: string
    LogoutResponse:
      type: object
      description: تأكيد إلغاء الجلسة فورًا (REQ-SEC-005)
      properties:
        status:
          type: string
          enum:
          - logged_out
    IdentitySummary:
      type: object
      description: وصف مختصر لوسيلة هوية مرتبطة بحساب (REQ-IAM-016)
      properties:
        id:
          type: string
          format: uuid
        provider_code:
          type: string
        is_verified:
          type: boolean
        is_primary:
          type: boolean
        last_authenticated_at:
          type: string
          format: date-time
          nullable: true
    IdentityListResponse:
      type: object
      properties:
        identities:
          type: array
          items:
            $ref: '#/components/schemas/IdentitySummary'
    IdentityAddRequest:
      type: object
      description: ربط وسيلة هوية إضافية بحساب المستخدم الحالي (REQ-IAM-015)
      required:
      - provider_code
      - external_identifier
      properties:
        provider_code:
          type: string
          example: email_password
        external_identifier:
          type: string
        is_verified:
          type: boolean
          default: false
    IdentityAddResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        provider_code:
          type: string
        is_verified:
          type: boolean
    ProviderSummary:
      type: object
      description: وسيلة هوية متاحة حاليًا للتسجيل/الدخول (REQ-IAM-013)
      properties:
        code:
          type: string
        display_name:
          type: string
        category:
          type: string
          enum:
          - password
          - otp
          - oauth
    ProviderListResponse:
      type: object
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderSummary'
    CatalogPartCreateRequest:
      type: object
      required:
      - category_id
      properties:
        category_id:
          type: string
          format: uuid
    CatalogPartResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - proposed
          - approved
          - archived
    LocalizedNameCreateRequest:
      type: object
      required:
      - name_value
      - name_kind
      properties:
        name_value:
          type: string
        name_kind:
          type: string
          enum:
          - canonical
          - local
          - english
          - synonym
        locale:
          type: string
          nullable: true
    LocalizedNameResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name_value:
          type: string
        name_kind:
          type: string
        locale:
          type: string
          nullable: true
    OemNumberCreateRequest:
      type: object
      required:
      - manufacturer_ref_id
      - oem_number
      properties:
        manufacturer_ref_id:
          type: string
          format: uuid
        oem_number:
          type: string
    OemNumberResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        manufacturer_ref_id:
          type: string
          format: uuid
        oem_number:
          type: string
    ManufacturerResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - proposed
          - approved
          - archived
    ModelResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        manufacturer_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - proposed
          - approved
          - archived
    GenerationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        model_id:
          type: string
          format: uuid
    TrimCreateRequest:
      type: object
      required:
      - fuel_type_ref_id
      - transmission_type_ref_id
      properties:
        fuel_type_ref_id:
          type: string
          format: uuid
        transmission_type_ref_id:
          type: string
          format: uuid
    TrimResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        generation_id:
          type: string
          format: uuid
        fuel_type_ref_id:
          type: string
          format: uuid
        transmission_type_ref_id:
          type: string
          format: uuid
    CompatibilityRecordCreateRequest:
      type: object
      required:
      - catalog_part_ref_id
      - trim_ref_id
      properties:
        catalog_part_ref_id:
          type: string
          format: uuid
        trim_ref_id:
          type: string
          format: uuid
    CompatibilityRecordResponse:
      type: object
      description: 'يقتصر على الحقول المخزَّنة فعليًا في 007_cmp.sql. حقول fitment_type/compatibility_notes/source
        المذكورة في كود الخدمة كخطة مستقبلية (Backlog) لا تقابلها أعمدة في قاعدة البيانات بعد، وتستوجب
        Migration وقرارًا حوكميًا منفصلَين قبل إضافتها لهذا العقد.

        '
      properties:
        id:
          type: string
          format: uuid
        catalog_part_ref_id:
          type: string
          format: uuid
        trim_ref_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - active
          - archived
    StoreCreateRequest:
      type: object
      properties:
        country_ref_id:
          type: string
          format: uuid
          nullable: true
        city_ref_id:
          type: string
          format: uuid
          nullable: true
    StoreResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        owner_user_ref_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - creating
          - active
          - suspended
          - archived
        country_ref_id:
          type: string
          format: uuid
          nullable: true
        city_ref_id:
          type: string
          format: uuid
          nullable: true
    StoreStatusUpdateRequest:
      type: object
      required:
      - new_status
      properties:
        new_status:
          type: string
          enum:
          - creating
          - active
          - suspended
          - archived
    StoreTransferOwnershipRequest:
      type: object
      required:
      - new_owner_user_ref_id
      properties:
        new_owner_user_ref_id:
          type: string
          format: uuid
    InventoryItemFullResponse:
      type: object
      description: العرض الكامل لعنصر المخزون (يختلف عن InventoryItemCreateResponse المختصَرة عند الإنشاء)
      properties:
        id:
          type: string
          format: uuid
        store_id:
          type: string
          format: uuid
        catalog_part_ref_id:
          type: string
          format: uuid
        condition_ref_id:
          type: string
          format: uuid
        pricing_mode:
          type: string
          enum:
          - fixed_price
          - contact_for_price
        quantity:
          type: integer
        price_amount:
          type: number
          nullable: true
        price_currency:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - active
          - out_of_stock
          - hidden
          - archived
    QuantityUpdateRequest:
      type: object
      required:
      - new_quantity
      properties:
        new_quantity:
          type: integer
          minimum: 0
    PricingUpdateRequest:
      type: object
      required:
      - pricing_mode
      properties:
        pricing_mode:
          type: string
          enum:
          - fixed_price
          - contact_for_price
        price_amount:
          type: number
          nullable: true
        price_currency:
          type: string
          nullable: true
    PurchaseRequestCreateRequest:
      type: object
      required:
      - catalog_part_ref_id
      - trim_ref_id
      properties:
        catalog_part_ref_id:
          type: string
          format: uuid
        trim_ref_id:
          type: string
          format: uuid
        condition_ref_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            CR-022: إشارة مرجعية اختيارية لـ ref.ref_values من النوع
            part_condition. NULL = بلا تفضيل. يُرفَض بـ400 INVALID_CONDITION_REF
            إن أشار لقيمة غير موجودة أو من نوع مرجعي آخر أو غير نشطة.
        notes:
          type: string
          nullable: true
          maxLength: 2000
          description: 'CR-022: ملاحظات المشتري الاختيارية، نص عادي، حد 2000 حرف.'
    PurchaseRequestResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        business_code:
          type: string
          nullable: true
        buyer_user_ref_id:
          type: string
          format: uuid
        catalog_part_ref_id:
          type: string
          format: uuid
        trim_ref_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - open
          - under_review
          - fulfilled
          - expired
          - cancelled
        condition_ref_id:
          type: string
          format: uuid
          nullable: true
          description: 'CR-022: NULL = بلا تفضيل، أو السجل تاريخي سابق للترحيل 028.'
        notes:
          type: string
          nullable: true
          description: 'CR-022: NULL = لا ملاحظات، أو السجل تاريخي سابق للترحيل 028.'
    OfferResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        business_code:
          type: string
          nullable: true
        purchase_request_id:
          type: string
          format: uuid
        seller_store_ref_id:
          type: string
          format: uuid
        amount:
          type: number
        currency:
          type: string
        provides_shipping:
          type: boolean
        notes:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - submitted
          - accepted
          - rejected
          - withdrawn
          - expired
    MessageSendRequest:
      type: object
      required:
      - context_type
      - context_ref_id
      - body
      properties:
        context_type:
          type: string
          enum:
          - purchase_request
          - inventory_item
        context_ref_id:
          type: string
          format: uuid
        body:
          type: string
          minLength: 1
    MessageResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        sender_user_ref_id:
          type: string
          format: uuid
        body:
          type: string
        is_deleted_by_sender:
          type: boolean
        is_deleted_by_recipient:
          type: boolean
    AttachmentCreateRequest:
      type: object
      required:
      - file_name
      - mime_type
      - size_bytes
      properties:
        file_name:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
    AttachmentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        file_name:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
    NotificationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        recipient_id:
          type: string
          format: uuid
        is_read:
          type: boolean
        is_archived_by_user:
          type: boolean
    RatingCreateRequest:
      type: object
      required:
      - target_type
      - target_ref_id
      - source_purchase_request_ref_id
      - score
      properties:
        target_type:
          type: string
          enum:
          - seller
          - store
          - purchase_experience
        target_ref_id:
          type: string
          format: uuid
        source_purchase_request_ref_id:
          type: string
          format: uuid
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
    RatingUpdateRequest:
      type: object
      required:
      - score
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
    RatingResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        rated_by_user_ref_id:
          type: string
          format: uuid
        target_type:
          type: string
        target_ref_id:
          type: string
          format: uuid
        source_purchase_request_ref_id:
          type: string
          format: uuid
        score:
          type: integer
        comment:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - active
          - archived
    AverageScoreResponse:
      type: object
      properties:
        target_type:
          type: string
        target_ref_id:
          type: string
          format: uuid
        average_score:
          type: number
          nullable: true
    ScheduledJobCreateRequest:
      type: object
      required:
      - job_type
      - target_ref_id
      - scheduled_at
      properties:
        job_type:
          type: string
        target_ref_id:
          type: string
          format: uuid
        scheduled_at:
          type: string
          format: date-time
        recurrence_rule:
          type: string
          enum:
          - daily
          - weekly
          - monthly
          nullable: true
    ScheduledJobResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        job_type:
          type: string
        target_ref_id:
          type: string
          format: uuid
        scheduled_at:
          type: string
          format: date-time
        recurrence_rule:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - pending
          - executing
          - completed
          - cancelled
          - failed
        last_run_at:
          type: string
          format: date-time
          nullable: true
    RefValueCreateRequest:
      type: object
      required:
      - ref_type
      - code
      properties:
        ref_type:
          type: string
          enum:
          - country
          - city
          - language
          - fuel_type
          - transmission_type
          - engine_type
          - part_condition
          - subscription_type
        code:
          type: string
    RefValueResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ref_type:
          type: string
        code:
          type: string
        status:
          type: string
          enum:
          - active
          - archived
    PlanCreateRequest:
      type: object
      required:
      - plan_type_ref_id
      properties:
        plan_type_ref_id:
          type: string
          format: uuid
    PlanResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        plan_type_ref_id:
          type: string
          format: uuid
        is_free:
          type: boolean
          default: false
          description: CR-014؛ خطة Free النظامية الوحيدة، لا تُنشأ عبر POST /plans
    SubscribeRequest:
      type: object
      required:
      - plan_id
      properties:
        plan_id:
          type: string
          format: uuid
        duration_days:
          type: integer
          default: 30
          minimum: 1
    ChangePlanRequest:
      type: object
      required:
      - new_plan_id
      properties:
        new_plan_id:
          type: string
          format: uuid
    SubscriptionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        seller_ref_id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - active
          - expired
        expires_at:
          type: string
          format: date-time
          nullable: true
    ArticleCreateRequest:
      type: object
      required:
      - title
      - body
      properties:
        title:
          type: string
        body:
          type: string
    ArticleResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        author_ref_id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        status:
          type: string
          enum:
          - unpublished
          - published
    TicketCreateRequest:
      type: object
      required:
      - subject
      properties:
        subject:
          type: string
    TicketResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        requester_ref_id:
          type: string
          format: uuid
        assigned_moderator_ref_id:
          type: string
          format: uuid
          nullable: true
        subject:
          type: string
        status:
          type: string
          enum:
          - open
          - in_progress
          - resolved
          - closed
        reopen_window_expires_at:
          type: string
          format: date-time
          nullable: true
    AssignRequest:
      type: object
      required:
      - moderator_ref_id
      properties:
        moderator_ref_id:
          type: string
          format: uuid
    ReplyCreateRequest:
      type: object
      required:
      - body
      properties:
        body:
          type: string
          minLength: 1
    ReplyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ticket_id:
          type: string
          format: uuid
        author_ref_id:
          type: string
          format: uuid
        body:
          type: string
    PurchaseRequestListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseRequestResponse'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      description: 'CR-015: GET /purchase-requests/mine'
    OfferListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OfferResponse'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      description: 'CR-015: GET /purchase-requests/{prId}/offers — النطاق يعتمد على صلاحية الطالب: صاحب
        طلب الشراء يرى كل العروض؛ بائع يرى عرضه هو فقط (تصفية على مستوى الاستعلام، لا حقل إضافي في الجسم).'
    StoreListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StoreResponse'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      description: 'CR-015: GET /store/stores — استخدام إداري فقط (مدير النظام أو المشرف)، لا Directory
        عام.'
    InventoryItemListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InventoryItemFullResponse'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      description: 'CR-015: GET /inventory/items/mine — مالك المتجر فقط، كل الحقول شاملة hidden/archived.'
    InventoryItemPublicResponse:
      type: object
      description: 'CR-015: عرض عام محدود الحقول لعنصر مخزون — Schema منفصل بنيويًا عن InventoryItemFullResponse،
        لا owner فقط استخدام مقيَّد. لا quantity الدقيقة ولا store_id ولا أي حقل داخلي؛ لا حقل توفر مشتق
        (is_available) — القرار الصريح في CR-015 كان عدم إضافته لعدم اعتماد قاعدة اشتقاقه.'
      properties:
        id:
          type: string
          format: uuid
        catalog_part_ref_id:
          type: string
          format: uuid
        condition_ref_id:
          type: string
          format: uuid
        pricing_mode:
          type: string
          enum:
          - fixed_price
          - contact_for_price
        price_amount:
          type: number
          nullable: true
        price_currency:
          type: string
          nullable: true
    InventoryItemPublicListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InventoryItemPublicResponse'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      description: 'CR-015: GET /store/stores/{storeId}/inventory-items — عام بالكامل، لا جلسة مطلوبة.
        يستبعد دومًا hidden/archived على مستوى الاستعلام.'
    ConversationLastMessagePreview:
      type: object
      nullable: true
      properties:
        body_preview:
          type: string
          maxLength: 140
        sent_at:
          type: string
          format: date-time
          description: مصدره com.messages.created_at (عمود موجود أصلًا منذ 011_com.sql، لم يكن مكشوفًا
            قبل CR-015).
    ConversationSummaryResponse:
      type: object
      description: 'CR-015: لا unread_count — تتبُّع القراءة (com.message_delivery_tracking) موجود بنيويًا
        لكن لا مسار REST يكتب read_at فعليًا حاليًا؛ إضافة الحقل الآن كانت ستُنتج قيمة مضلِّلة دائمًا.
        other_participant_user_ref_ids قائمة لا معرّف واحد: محادثة سياق purchase_request قد تضم أكثر من
        بائع فعليًا (لا تقسيم للمحادثة حسب مقدّم العرض في التصميم الحالي).'
      properties:
        id:
          type: string
          format: uuid
        context_type:
          type: string
          enum:
          - purchase_request
          - inventory_item
        context_ref_id:
          type: string
          format: uuid
        other_participant_user_ref_ids:
          type: array
          items:
            type: string
            format: uuid
        last_message:
          $ref: '#/components/schemas/ConversationLastMessagePreview'
    ConversationListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConversationSummaryResponse'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      description: 'CR-015: GET /conversations'
    ScheduledJobListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ScheduledJobResponse'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      description: 'CR-015: GET /admin/scheduled-jobs — مدير النظام حصريًا.'
    CatalogPartListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogPartResponse'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      description: 'CR-015: GET /pct/parts — status=approved (افتراضي): قراءة عامة بلا جلسة. status=proposed
        أو archived: يتطلب جلسة + دور اعتماد كتالوج (super_admin أو admin — نفس نطاق صلاحية /parts/{id}/approve
        الموجودة أصلًا).'
    MeResponse:
      type: object
      description: 'CR-016 (Session Introspection): يمكِّن الواجهة من معرفة المستخدم الحالي من الجلسة
        القائمة فعليًا (بعد Refresh/SSR/فتح مباشر/تبويب جديد) — لا Token جديد، لا تغيير على آلية المصادقة
        أو خصائص Cookie الحالية (HttpOnly/Secure/SameSite كما هي).'
      properties:
        user_id:
          type: string
          format: uuid
        primary_role:
          type: string
        account_status:
          type: string
      required:
      - user_id
      - primary_role
      - account_status
    StorePublicResponse:
      type: object
      description: 'CR-017: عرض عام لمتجر status=''active'' فقط — يستبعد owner_user_ref_id عمدًا (تسريب
        خصوصية). غير active → 404.'
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - active
        country_ref_id:
          type: string
          format: uuid
          nullable: true
        city_ref_id:
          type: string
          format: uuid
          nullable: true
    RegisterRequest:
      type: object
      description: 'CR-018: التسجيل العام مقصور على Provider واحد (email_password) — لا Phone OTP ولا
        OAuth في هذا النطاق. role_choice لا يقبل أي قيمة إدارية (admin/moderator/super_admin/news_editor/support_moderator)
        بنيويًا — Enum مقيَّد لقيمتين فقط.'
      properties:
        role_choice:
          type: string
          enum:
          - buyer
          - seller
        account_type:
          type: string
          enum:
          - individual
          - business
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          description: الحد الأدنى 8 أحرف فقط — بلا إلزام تركيبة معقَّدة (قرار منتج صريح).
      required:
      - role_choice
      - account_type
      - email
      - password
    RegisterResponse:
      type: object
      description: 'CR-018: store_id غير null فقط عند role_choice=''seller'' (REQ-STR-001 — إنشاء متجر
        تلقائي واحد ضمن نفس المعاملة الذرّية)؛ null للمشتري.'
      properties:
        user_id:
          type: string
          format: uuid
        primary_role:
          type: string
          enum:
          - individual_buyer
          - business_buyer
          - individual_seller
          - business_seller
        account_type:
          type: string
          enum:
          - individual
          - business
        store_id:
          type: string
          format: uuid
          nullable: true
      required:
      - user_id
      - primary_role
      - account_type
    InventoryItemPublicDetailResponse:
      type: object
      description: 'CR-019: توسيع مخصَّص لمسار التفاصيل المفرد فقط — منفصلة تمامًا عن InventoryItemPublicResponse
        (تخدم القائمة العامة تحت متجر، بلا تغيير). part_name من pct.localized_names (canonical). condition_code
        هو ref.ref_values.code الخام — لا عمود Label مترجَم موجود في نموذج البيانات الحالي، فلا يُدَّعى
        وجود ترجمة. لا store_name (GAP-A: Store Public Identity، منفصلة) ولا صورة (GAP-B: Inventory Photos،
        منفصلة، تحتاج Migration). لا owner_user_ref_id ولا quantity ولا business_code.'
      properties:
        id:
          type: string
          format: uuid
        store_id:
          type: string
          format: uuid
        catalog_part_ref_id:
          type: string
          format: uuid
        condition_ref_id:
          type: string
          format: uuid
        part_name:
          type: string
          nullable: true
          description: من pct.localized_names (name_kind='canonical')؛ null إن لم يوجد اسم مُدرَج.
        condition_code:
          type: string
          nullable: true
          description: ref.ref_values.code الخام؛ null إن لم يُعثَر على القيمة المرجعية.
        pricing_mode:
          type: string
          enum:
          - fixed_price
          - contact_for_price
        price_amount:
          type: number
          nullable: true
        price_currency:
          type: string
          nullable: true
      required:
      - id
      - store_id
      - catalog_part_ref_id
      - condition_ref_id
      - pricing_mode
    PurchaseRequestDisplayResponse:
      type: object
      description: 'CR-021: Read Model عرض فقط — منفصلة تمامًا عن PurchaseRequestResponse (لا تُستخدَم
        في أي مسار كتابة/قبول/رفض/إلغاء). كل حقل اسم قد يكون null (غياب اسم محلَّي حقيقي، لا خطأ). عمدًا
        بلا generation_name/trim_label/year — غير موجودة في نموذج البيانات الحالي إطلاقًا؛ لا تُقدَّم
        هنا كحقول null تحسبًا لإيحائها باكتمال البيانات (راجع Vehicle Taxonomy Completeness Fact-Finding).'
      properties:
        id:
          type: string
          format: uuid
        business_code:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - open
          - under_review
          - fulfilled
          - expired
          - cancelled
        created_at:
          type: string
          format: date-time
        catalog_part_ref_id:
          type: string
          format: uuid
        part_name:
          type: string
          nullable: true
          description: من pct.localized_names (canonical)؛ null إن لم يوجد اسم مُدرَج.
        trim_ref_id:
          type: string
          format: uuid
        model_id:
          type: string
          format: uuid
          nullable: true
        model_name:
          type: string
          nullable: true
          description: من vct.localized_names (owner_type='model').
        manufacturer_id:
          type: string
          format: uuid
          nullable: true
        manufacturer_name:
          type: string
          nullable: true
          description: من vct.localized_names (owner_type='manufacturer').
      required:
      - id
      - status
      - created_at
      - catalog_part_ref_id
      - trim_ref_id
    PurchaseRequestDisplayListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseRequestDisplayResponse'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
paths:
  /api/v1/subscriptions/plans:
    post:
      operationId: createSubscriptionPlan
      summary: تعريف خطة اشتراك جديدة (مدير النظام حصريًا، REQ-SUB-001)
      x-traceability:
        requirements:
        - REQ-SUB-001
        decisions: []
      security:
      - sessionAuth: []
      parameters:
      - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanCreateRequest'
      responses:
        '201':
          description: أُنشئت الخطة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        '403':
          description: ليس مدير نظام
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      operationId: listSubscriptionPlans
      summary: عرض كل خطط الاشتراك المتاحة
      x-traceability:
        requirements:
        - REQ-SUB-002
        decisions: []
      security:
      - sessionAuth: []
      parameters:
      - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: قائمة الخطط
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanResponse'
  /api/v1/subscriptions:
    post:
      operationId: subscribeToPlan
      summary: اشتراك البائع الحالي في خطة (REQ-SUB-002)
      description: 'CR-014: كل بائع يملك اشتراك Free نشطًا دومًا افتراضيًا؛ الاشتراك في خطة مدفوعة أثناء
        وجود Free فقط هو ترقية مسموحة دائمًا، وليس تعارضًا. 409 يقع فقط عند وجود خطة مدفوعة أخرى نشطة
        وغير منتهية بالفعل.'
      x-traceability:
        requirements:
        - REQ-SUB-002
        decisions:
        - مدة الاشتراك عبر duration_days، لا مصدر آخر لها
        - 'CR-014: الترقية من Free لا تُعامَل كاشتراك مكرر'
      security:
      - sessionAuth: []
      parameters:
      - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscribeRequest'
      responses:
        '201':
          description: تم الاشتراك
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '400':
          description: مدة غير صالحة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: يوجد اشتراك مدفوع نشط بالفعل
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/subscriptions/mine:
    get:
      operationId: getMySubscription
      summary: عرض اشتراك المستخدم الحالي (Free دومًا كحد أدنى، CR-014)
      description: 'CR-014: لا وجود لحالة "بلا اشتراك" من منظور الواجهة. أول استعلام لبائع لم يشترك قط
        ينشئ له اشتراك Free تلقائيًا. انتهاء خطة مدفوعة (Lazy Check) يعيد البائع تلقائيًا لخطة Free بدل
        حالة منتهية مسدودة؛ الحقل null يبقى ممكنًا نظريًا فقط دفاعيًا (بيئة لم تُطبَّق عليها 026).'
      x-traceability:
        requirements:
        - REQ-SUB-004
        decisions:
        - 'CR-014: عضوية Free دائمة لكل بائع'
      security:
      - sessionAuth: []
      parameters:
      - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: الاشتراك الفعال الحالي (Free كحد أدنى دومًا)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
  /api/v1/subscriptions/{subscriptionId}/change-plan:
    post:
      operationId: changeSubscriptionPlan
      summary: تغيير خطة اشتراك قائم، يسري فورًا (صاحبه حصرًا، REQ-SUB-005/005-A)
      x-traceability:
        requirements:
        - REQ-SUB-005
        decisions: []
      security:
      - sessionAuth: []
      parameters:
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePlanRequest'
      responses:
        '200':
          description: تغيَّرت الخطة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '403':
          description: ليس صاحب الاشتراك
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: غير موجود
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: اشتراك غير نشط
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/content/articles:
    post:
      operationId: createArticle
      summary: إنشاء مقال (محرر الأخبار حصريًا، REQ-CNT-001)
      x-traceability:
        requirements:
        - REQ-CNT-001
        decisions: []
      security:
      - sessionAuth: []
      parameters:
      - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleCreateRequest'
      responses:
        '201':
          description: أُنشئ بحالة unpublished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleResponse'
        '400':
          description: حقل فارغ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ليس محرر أخبار
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      operationId: listPublishedArticles
      summary: عرض كل المقالات المنشورة (عام بالكامل)
      x-traceability: &id001
        requirements: []
        decisions:
        - CR-017
