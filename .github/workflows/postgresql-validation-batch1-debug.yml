name: PostgreSQL Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "postgres_execution_package/**"
      - ".github/workflows/postgresql-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "postgres_execution_package/**"
      - ".github/workflows/postgresql-validation.yml"

permissions:
  contents: read

concurrency:
  group: postgresql-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-postgresql:
    name: PostgreSQL 16 / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      DB_NAME: carparts_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carparts_test
      PYTHONUNBUFFERED: "1"
      PACKAGE_DIR: postgres_execution_package
      EVIDENCE_DIR: execution-evidence

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: postgres_execution_package/requirements.txt

      - name: Prepare evidence directory
        run: mkdir -p "$EVIDENCE_DIR"

      - name: Record environment and versions
        run: |
          set -o pipefail
          {
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            python --version
            pip --version
            psql --version
          } 2>&1 | tee "$EVIDENCE_DIR/environment.txt"

      - name: Wait for PostgreSQL readiness
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres; then
              echo "PostgreSQL is ready."
              exit 0
            fi
            echo "Waiting for PostgreSQL ($attempt/60)..."
            sleep 2
          done
          echo "PostgreSQL did not become ready in time." >&2
          exit 1

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r "$PACKAGE_DIR/requirements.txt" 2>&1 | tee "$EVIDENCE_DIR/dependency-install.log"
          python -m pip freeze | tee "$EVIDENCE_DIR/python-packages.txt"

      - name: Verify execution package structure
        run: |
          set -euo pipefail
          required_files=(
            "$PACKAGE_DIR/README.md"
            "$PACKAGE_DIR/requirements.txt"
            "$PACKAGE_DIR/scripts/setup_test_database.sh"
            "$PACKAGE_DIR/scripts/teardown_test_database.sh"
            "$PACKAGE_DIR/tools/schema_drift_check.py"
            "$PACKAGE_DIR/tests/conftest.py"
            "$PACKAGE_DIR/tests/test_postgres_repositories.py"
            "$PACKAGE_DIR/tests/test_postgres_integration.py"
          )
          missing_files=0
          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then echo "FOUND: $file"; else echo "MISSING: $file" >&2; missing_files=$((missing_files+1)); fi
          done
          migration_count="$(find "$PACKAGE_DIR/migrations" -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          {
            echo "migration_count=$migration_count"
            echo "missing_files=$missing_files"
          } | tee "$EVIDENCE_DIR/package-verification.txt"
          test "$missing_files" -eq 0
          test "$migration_count" -eq 31
          echo "Execution package structure is valid."


      - name: Verify conftest import paths before pytest
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail

          echo "=== conftest.py identity ==="
          sha256sum tests/conftest.py | tee "../$EVIDENCE_DIR/conftest-sha256.txt"

          expected_sha="8819b8aaf851eac468a08a756636372a72f6baaa05a7e17463d6dd86b819839d"
          actual_sha="$(sha256sum tests/conftest.py | awk '{print $1}')"
          echo "expected_sha=$expected_sha"
          echo "actual_sha=$actual_sha"
          test "$actual_sha" = "$expected_sha"

          echo
          echo "=== conftest.py relevant lines ==="
          grep -nE '(^|[^A-Za-z0-9_])glob|_SERVICES_DIR|services.*/src|_SERVICE_NAMES' tests/conftest.py || true

          echo
          echo "=== discovered service src directories ==="
          find services -mindepth 2 -maxdepth 2 -type d -name src -print | sort

          echo
          echo "=== Python import-path verification ==="
          python - <<'PY'
          import hashlib
          import importlib
          import importlib.util
          import pathlib
          import sys

          package_root = pathlib.Path.cwd()
          conftest_path = package_root / "tests" / "conftest.py"

          raw = conftest_path.read_bytes()
          digest = hashlib.sha256(raw).hexdigest()
          expected = "8819b8aaf851eac468a08a756636372a72f6baaa05a7e17463d6dd86b819839d"
          print("conftest:", conftest_path)
          print("sha256:", digest)
          if digest != expected:
              raise SystemExit(f"Unexpected conftest.py SHA-256: {digest}")

          # Execute the exact conftest.py that pytest will load.
          spec = importlib.util.spec_from_file_location("_ci_conftest_probe", conftest_path)
          if spec is None or spec.loader is None:
              raise RuntimeError("Could not create import spec for tests/conftest.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          service_src_dirs = sorted(
              p.resolve()
              for p in (package_root / "services").glob("*/src")
              if p.is_dir()
          )
          print(f"discovered_service_src_dirs={len(service_src_dirs)}")
          for p in service_src_dirs:
              present = str(p) in sys.path
              print(f"{'OK' if present else 'MISSING'} sys.path: {p}")
              if not present:
                  raise SystemExit(f"Service src directory was not added to sys.path: {p}")

          required_modules = [
              "trm_repository",
              "scheduler_repository",
              "search_repository",
              "store_repository",
              "pct_repository",
              "vct_repository",
              "cmp_repository",
              "advisory_lock",
          ]

          for name in required_modules:
              imported = importlib.import_module(name)
              location = getattr(imported, "__file__", None)
              print(f"OK import: {name} -> {location}")

          print("CONFTST_IMPORT_PATH_VERIFICATION=PASSED")
          PY

      - name: Create database and apply 31 migrations
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          ./scripts/setup_test_database.sh 2>&1 | tee "../$EVIDENCE_DIR/migrations.log"

      - name: Capture schema inventory
        run: |
          set -euo pipefail
          psql -d "$DB_NAME" -v ON_ERROR_STOP=1 -c "\dn+" > "$EVIDENCE_DIR/schema-list.txt" 2>&1
          psql -d "$DB_NAME" -v ON_ERROR_STOP=1 -c "SELECT schemaname, tablename FROM pg_tables WHERE schemaname NOT IN ('pg_catalog','information_schema') ORDER BY schemaname, tablename;" > "$EVIDENCE_DIR/table-list.txt" 2>&1
          pg_dump --schema-only --no-owner --no-privileges "$DB_NAME" > "$EVIDENCE_DIR/schema.sql"

      - name: Run schema drift check
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python tools/schema_drift_check.py 2>&1 | tee "../$EVIDENCE_DIR/schema-drift.json"

      - name: Run repository tests
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_postgres_repositories.py -vv \
            --junitxml="../$EVIDENCE_DIR/repository-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/repository-tests.log"

      - name: Run integration tests
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_postgres_integration.py -vv \
            --junitxml="../$EVIDENCE_DIR/integration-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/integration-tests.log"

      - name: Run auth session and credential unit tests (CR-013)
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_session_service.py tests/test_credential_service.py -vv \
            --junitxml="../$EVIDENCE_DIR/auth-unit-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/auth-unit-tests.log"

      - name: Run auth REST API tests (CR-013)
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_auth_api.py -vv \
            --junitxml="../$EVIDENCE_DIR/auth-api-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/auth-api-tests.log"

      - name: Run auth session and credential integration tests on live PostgreSQL (CR-013)
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_postgres_auth_sessions_integration.py tests/test_postgres_auth_credentials_integration.py -vv \
            --junitxml="../$EVIDENCE_DIR/auth-integration-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/auth-integration-tests.log"

      - name: Run PCT REST API unit tests
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_pct_api.py -vv \
            --junitxml="../$EVIDENCE_DIR/pct-api-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/pct-api-tests.log"

      - name: Run PCT REST API integration tests on live PostgreSQL
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_postgres_pct_api_integration.py -vv \
            --junitxml="../$EVIDENCE_DIR/pct-integration-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/pct-integration-tests.log"

      - name: Run VCT REST API unit tests
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_vct_api.py -vv \
            --junitxml="../$EVIDENCE_DIR/vct-api-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/vct-api-tests.log"

      - name: Run VCT REST API integration tests on live PostgreSQL
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_postgres_vct_api_integration.py -vv \
            --junitxml="../$EVIDENCE_DIR/vct-integration-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/vct-integration-tests.log"

      - name: Run CMP REST API unit tests
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_cmp_api.py -vv \
            --junitxml="../$EVIDENCE_DIR/cmp-api-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/cmp-api-tests.log"

      - name: Run CMP REST API integration tests on live PostgreSQL
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_postgres_cmp_api_integration.py -vv \
            --junitxml="../$EVIDENCE_DIR/cmp-integration-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/cmp-integration-tests.log"

      - name: Run Search REST API unit tests
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_search_api.py -vv \
            --junitxml="../$EVIDENCE_DIR/search-api-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/search-api-tests.log"

      - name: Run Search REST API integration tests on live PostgreSQL
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_postgres_search_api_integration.py -vv \
            --junitxml="../$EVIDENCE_DIR/search-integration-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/search-integration-tests.log"

      - name: Run Store REST API unit tests
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_store_api.py -vv \
            --junitxml="../$EVIDENCE_DIR/store-api-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/store-api-tests.log"

      - name: Run Store REST API integration tests on live PostgreSQL
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_postgres_store_api_integration.py -vv \
            --junitxml="../$EVIDENCE_DIR/store-integration-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/store-integration-tests.log"

      - name: Run Inventory Item REST API unit tests
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_inventory_item_api.py -vv \
            --junitxml="../$EVIDENCE_DIR/inventory-api-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/inventory-api-tests.log"

      - name: Run Inventory Item REST API integration tests on live PostgreSQL
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_postgres_inventory_item_api_integration.py -vv \
            --junitxml="../$EVIDENCE_DIR/inventory-integration-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/inventory-integration-tests.log"

      - name: Run Orders REST API unit tests
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_order_api.py -vv \
            --junitxml="../$EVIDENCE_DIR/orders-api-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/orders-api-tests.log"

      - name: Run Messaging REST API unit tests
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_message_api.py -vv \
            --junitxml="../$EVIDENCE_DIR/messaging-api-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/messaging-api-tests.log"

      - name: Run CR-015 Frontend Enablement API tests
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_cr015_frontend_enablement.py -vv \
            --junitxml="../$EVIDENCE_DIR/cr015-frontend-enablement-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/cr015-frontend-enablement-tests.log"

      - name: Run Notifications REST API unit tests
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_ntf_api.py -vv \
            --junitxml="../$EVIDENCE_DIR/notifications-api-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/notifications-api-tests.log"

      - name: Run Orders+Messaging+Notifications integration tests on live PostgreSQL
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_postgres_orders_messaging_notifications_integration.py -vv \
            --junitxml="../$EVIDENCE_DIR/orders-messaging-notifications-integration-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/orders-messaging-notifications-integration-tests.log"

      - name: Run TRM REST API unit tests
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_trm_api.py -vv \
            --junitxml="../$EVIDENCE_DIR/trm-api-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/trm-api-tests.log"

      - name: Run Scheduler admin REST API unit tests
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_scheduler_api.py -vv \
            --junitxml="../$EVIDENCE_DIR/scheduler-api-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/scheduler-api-tests.log"

      - name: Run Reference Data REST API unit tests
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_ref_api.py -vv \
            --junitxml="../$EVIDENCE_DIR/ref-api-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/ref-api-tests.log"

      - name: Run final batch (TRM+Scheduler+Reference Data) integration tests on live PostgreSQL
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_postgres_final_batch_integration.py -vv \
            --junitxml="../$EVIDENCE_DIR/final-batch-integration-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/final-batch-integration-tests.log"

      - name: Run Subscriptions REST API unit tests
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_sub_api.py -vv \
            --junitxml="../$EVIDENCE_DIR/sub-api-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/sub-api-tests.log"

      - name: Run Content Management REST API unit tests
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_cnt_api.py -vv \
            --junitxml="../$EVIDENCE_DIR/cnt-api-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/cnt-api-tests.log"

      - name: Run Support Tickets REST API unit tests
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_sup_api.py -vv \
            --junitxml="../$EVIDENCE_DIR/sup-api-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/sup-api-tests.log"

      - name: Run SUB+CNT+SUP integration tests on live PostgreSQL
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_postgres_sub_cnt_sup_integration.py -vv \
            --junitxml="../$EVIDENCE_DIR/sub-cnt-sup-integration-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/sub-cnt-sup-integration-tests.log"


      - name: Run full regression (361 tests)
        run: |
          set -euo pipefail
          SRC_PATHS="$(find full_regression/services -mindepth 2 -maxdepth 2 -type d -name src | sort | paste -sd: -)"
          TEST_PATHS="$(find full_regression/services -mindepth 2 -maxdepth 2 -type d -name tests | sort | tr '\n' ' ')"
          PYTHONPATH="$SRC_PATHS" python -m pytest $TEST_PATHS -vv \
            --junitxml="$EVIDENCE_DIR/full-regression.xml" \
            2>&1 | tee "$EVIDENCE_DIR/full-regression.log"

      - name: Generate execution summary
        if: always()
        run: |
          {
            echo "# PostgreSQL Validation Evidence"
            echo
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Attempt: $GITHUB_RUN_ATTEMPT"
            echo "- Commit: $GITHUB_SHA"
            echo "- PostgreSQL: 16"
            echo "- Python: 3.12"
            echo "- Timestamp (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Job status: ${{ job.status }}"
          } | tee "$EVIDENCE_DIR/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"


      - name: Capture PostgreSQL diagnostics on failure
        if: failure()
        run: |
          set +e
          mkdir -p "$EVIDENCE_DIR"
          echo "${{ job.services.postgres.id }}" > "$EVIDENCE_DIR/postgres-container-id.txt"
          docker inspect "${{ job.services.postgres.id }}" > "$EVIDENCE_DIR/postgres-container-inspect.json" 2>&1 || true
          docker logs "${{ job.services.postgres.id }}" > "$EVIDENCE_DIR/postgres-container.log" 2>&1 || true
          docker ps -a > "$EVIDENCE_DIR/docker-ps.txt" 2>&1 || true

      - name: Teardown test database
        if: always()
        working-directory: postgres_execution_package
        run: |
          chmod +x scripts/teardown_test_database.sh
          ./scripts/teardown_test_database.sh 2>&1 | tee "../$EVIDENCE_DIR/teardown.log" || true

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: postgresql-validation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: execution-evidence/
          if-no-files-found: error
          retention-days: 30
