            2>&1 | tee "../$EVIDENCE_DIR/sub-cnt-sup-integration-tests.log"


      - name: Run full regression (361 tests)
        run: |
          set -euo pipefail
          SRC_PATHS="$(find full_regression/services -mindepth 2 -maxdepth 2 -type d -name src | sort | paste -sd: -)"
          TEST_PATHS="$(find full_regression/services -mindepth 2 -maxdepth 2 -type d -name tests | sort | tr '\n' ' ')"
          PYTHONPATH="$SRC_PATHS" python -m pytest $TEST_PATHS -vv \
            --junitxml="$EVIDENCE_DIR/full-regression.xml" \
            2>&1 | tee "$EVIDENCE_DIR/full-regression.log"

      - name: Generate execution summary
        if: always()
        run: |
          {
            echo "# PostgreSQL Validation Evidence"
            echo
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Attempt: $GITHUB_RUN_ATTEMPT"
            echo "- Commit: $GITHUB_SHA"
            echo "- PostgreSQL: 16"
            echo "- Python: 3.12"
            echo "- Timestamp (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Job status: ${{ job.status }}"
          } | tee "$EVIDENCE_DIR/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"


      - name: Capture PostgreSQL diagnostics on failure
        if: failure()
        run: |
          set +e
          mkdir -p "$EVIDENCE_DIR"
          echo "${{ job.services.postgres.id }}" > "$EVIDENCE_DIR/postgres-container-id.txt"
          docker inspect "${{ job.services.postgres.id }}" > "$EVIDENCE_DIR/postgres-container-inspect.json" 2>&1 || true
          docker logs "${{ job.services.postgres.id }}" > "$EVIDENCE_DIR/postgres-container.log" 2>&1 || true
          docker ps -a > "$EVIDENCE_DIR/docker-ps.txt" 2>&1 || true

      - name: Teardown test database
        if: always()
        working-directory: postgres_execution_package
        run: |
          chmod +x scripts/teardown_test_database.sh
          ./scripts/teardown_test_database.sh 2>&1 | tee "../$EVIDENCE_DIR/teardown.log" || true

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: postgresql-validation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: execution-evidence/
          if-no-files-found: error
          retention-days: 30
